# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: sortie
report_sizes: true

before:
  hooks:
    - go mod verify
    - >-
      go run github.com/tc-hib/go-winres@v0.3.3 simply
      --arch amd64,arm64
      --out cmd/sortie/rsrc
      --manifest none
      --product-name Sortie
      --file-description Sortie
      --original-filename sortie.exe
      --product-version {{ .Version }}
      --file-version {{ .Version }}

builds:
  - id: sortie
    main: ./cmd/sortie
    binary: sortie
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - >-
        -s -w
        -X main.Version={{ .Version }}
        -X main.Commit={{ .FullCommit }}
        -X main.Date={{ .CommitDate }}
    flags:
      - -trimpath
    tags:
      - osusergo
      - netgo
    mod_timestamp: "{{ .CommitTimestamp }}"
    hooks:
      post:
        - cmd: ./scripts/swap-signed.sh "{{ .Path }}" "{{ .Os }}_{{ .Arch }}"
          output: true

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE*
      - README*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

sboms:
  - artifacts: archive

changelog:
  sort: asc
  use: git
  groups:
    - title: Features
      regexp: '^.*?feat(\([^)]+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([^)]+\))??!?:.+$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\([^)]+\))??!?:.+$'
      order: 2
    - title: Others
      order: 999
  filters:
    exclude:
      - "(?i)^docs[:(]"
      - "(?i)^tests?[:(]"
      - "(?i)^chore[:(]"
      - "(?i)^ci[:(]"
      - "(?i)^style[:(]"
      - "(?i)^refactor[:(]"
      - "(?i)^Merge pull request #"
      - "(?i)^Merge (remote-tracking )?branch '"

release:
  github:
    owner: kinged007
    name: sortie
  name_template: "{{ .ProjectName }} {{ .Version }}"
  footer: |
    {{ envOrDefault "RELEASE_NEW_CONTRIBUTORS" "" }}

    ---

    **Full changelog**: https://github.com/kinged007/sortie/blob/{{ .Tag }}/CHANGELOG.md

    **Diff**: https://github.com/kinged007/sortie/compare/{{ .PreviousTag }}...{{ .Tag }}

    **Code signing policy**: https://docs.sortie-ai.com/code-signing-policy/
  draft: false
  prerelease: auto
  make_latest: true
  mode: keep-existing

snapshot:
  version_template: "{{ incpatch .Version }}-SNAPSHOT-{{ .ShortCommit }}"
